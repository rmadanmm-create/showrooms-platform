<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة كتالوج المعارض الموحّد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --asphalt:#1F3864;
    --steel:#FFFFFF;
    --steel-2:#F3F5F8;
    --chrome:#1B222B;
    --chrome-dim:#6B7686;
    --amber:#C97A25;
    --amber-dim:#A8752C;
    --rust:#C4432B;
    --paper:#FFFFFF;
    --paper-dim:#EEF0F3;
    --page-bg:#F5F6F8;
    --border:#E1E5EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);color:var(--chrome);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- layout shells ---------- */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;background:var(--asphalt);
    border-bottom:3px solid var(--amber);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .plate{
    background:var(--amber);color:#fff;font-family:'Space Mono',monospace;
    font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:1px;font-size:13px;
  }
  .brand .name{font-family:'Tajawal',sans-serif;font-weight:900;font-size:20px;color:#fff;}
  .nav-links{display:flex;gap:8px;font-size:14px;color:#C7D2E3;}
  .nav-links span{cursor:pointer;padding:6px 10px;border-radius:8px;}
  .nav-links span:hover{background:rgba(255,255,255,.12);color:#fff;}

  main{flex:1;padding:32px 24px;max-width:1100px;margin:0 auto;width:100%;}

  /* ---------- landing ---------- */
  .hero{text-align:center;padding:60px 20px 30px;}
  .hero h1{font-size:34px;font-weight:900;margin:0 0 10px;color:var(--asphalt);}
  .hero p{color:var(--chrome-dim);font-size:15px;max-width:520px;margin:0 auto;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:640px;margin:40px auto 0;}
  @media (max-width:600px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--steel);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 20px;text-align:center;transition:.15s;box-shadow:0 2px 10px rgba(20,30,50,.05);
  }
  .role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .role-card .icon{font-size:34px;margin-bottom:10px;display:block;}
  .role-card h3{margin:0 0 6px;font-size:18px;}
  .role-card p{color:var(--chrome-dim);font-size:13px;margin:0 0 16px;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-block;padding:11px 22px;border-radius:9px;border:none;
    font-weight:700;font-size:14px;
  }
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{background:#B56A18;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--chrome);}
  .btn-outline:hover{border-color:var(--asphalt);color:var(--asphalt);}
  .btn-rust{background:var(--rust);color:#fff;}
  .btn-sm{padding:7px 14px;font-size:13px;border-radius:7px;}
  .btn-block{width:100%;}

  /* ---------- panel / card ---------- */
  .panel{
    background:var(--steel);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;margin-bottom:24px;box-shadow:0 2px 10px rgba(20,30,50,.05);
  }
  .panel h2{margin:0 0 18px;font-size:20px;display:flex;align-items:center;gap:8px;color:var(--asphalt);}
  label{display:block;font-size:13px;color:var(--chrome-dim);margin:12px 0 6px;}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);
    background:#fff;color:var(--chrome);font-size:14px;
  }
  input::placeholder,textarea::placeholder{color:#A9B2BE;}
  textarea{min-height:80px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){.row2{grid-template-columns:1fr;}}

  /* ---------- spec-plate car card (signature element) ---------- */
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
  .plate-card{
    position:relative;background:#FBFAF7;color:var(--asphalt);border-radius:12px;
    overflow:hidden;border:2px solid #DCD5C2;box-shadow:0 3px 10px rgba(20,30,50,.08);
  }
  .plate-card .rivets{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;}
  .plate-card .rivets i{width:5px;height:5px;border-radius:50%;background:#b8b2a2;display:block;}
  .plate-card img{width:100%;height:150px;object-fit:cover;display:block;background:#ddd;}
  .plate-body{padding:14px 16px 16px;}
  .plate-title{font-family:'Tajawal',sans-serif;font-weight:900;font-size:17px;margin:0 0 2px;}
  .plate-sub{font-size:12px;color:#6b6555;margin:0 0 10px;}
  .plate-specs{font-size:11.5px;color:#4a4a44;line-height:1.7;margin:0 0 12px;}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .swatch{
    font-family:'Space Mono',monospace;font-size:10.5px;border:1px solid #b8b2a2;
    padding:3px 8px;border-radius:5px;background:#fff;color:#333;
  }
  .price-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--asphalt);color:#FFD9A0;
    font-family:'Space Mono',monospace;font-weight:700;padding:7px 12px;border-radius:8px;font-size:15px;
  }
  .price-chip small{color:#AEBFDA;font-family:'IBM Plex Sans Arabic';font-size:11px;}
  .qty-badge{
    font-family:'Space Mono',monospace;font-size:11px;background:var(--paper-dim);
    padding:4px 9px;border-radius:6px;color:#555;margin-inline-start:8px;
  }

  /* dealer's own listing row style */
  .listing-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#F9FAFB;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;
    flex-wrap:wrap;
  }
  .listing-row .info{font-size:13px;color:var(--chrome-dim);}
  .listing-row .info b{color:var(--chrome);font-family:'Tajawal',sans-serif;}

  .empty{
    text-align:center;padding:40px 20px;color:var(--chrome-dim);border:1px dashed var(--border);border-radius:12px;
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--asphalt);color:#fff;padding:12px 20px;border-radius:10px;
    font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:999;
  }
  .link-box{
    display:flex;gap:8px;align-items:center;background:#F9FAFB;border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-family:'Space Mono',monospace;font-size:12.5px;color:var(--amber);
    overflow-x:auto;white-space:nowrap;
  }
  .storefront-header{
    text-align:center;padding:34px 20px 24px;background:var(--asphalt);
    border-bottom:3px solid var(--amber);
  }
  .storefront-header img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:10px;border:2px solid var(--amber);}
  .storefront-header h1{margin:0 0 4px;font-size:26px;color:#fff;}
  .storefront-header p{color:#C7D2E3;font-size:13px;margin:0;}
  .whatsapp-btn{
    display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#0b1f14;font-weight:700;
    padding:8px 16px;border-radius:8px;font-size:13px;margin-top:14px;text-decoration:none;
  }
  footer{text-align:center;padding:20px;color:var(--chrome-dim);font-size:12px;}
  .muted{color:var(--chrome-dim);font-size:13px;}
  .tag{display:inline-block;background:var(--steel-2);color:var(--chrome);font-size:11px;padding:3px 9px;border-radius:6px;margin-inline-end:6px;}
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="toastHost"></div>

<script>
/* =====================================================================
   إعداد Supabase — عدّل هذين السطرين ببيانات مشروعك من:
   Supabase Dashboard → Settings → API
===================================================================== */
const SUPABASE_URL = "https://rfppgkezqkfuavghnipj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4HF9KC4suTJVX5-CDOWazA_idb5Cw7o";
const ADMIN_PASSWORD = "admin123"; // غيّرها قبل النشر — حماية بسيطة للوحة المدير في هذا الـ MVP

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");

/* ---------------- helpers ---------------- */
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("toastHost").appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function fmtPrice(p){
  return Number(p).toLocaleString("en-US");
}
function currentDealer(){
  try{ return JSON.parse(localStorage.getItem("dealer_session")); }catch(e){ return null; }
}
function isConfigured(){
  return SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";
}

/* ---------------- topbar ---------------- */
function renderTopbar(){
  const dealer = currentDealer();
  const bar = el(`
    <div class="topbar">
      <div class="brand">
        <span class="plate">KSA-CARS</span>
        <span class="name">منصة كتالوج المعارض</span>
      </div>
      <div class="nav-links">
        <span data-go="#/">الرئيسية</span>
        <span data-go="#/admin">لوحة المدير</span>
        ${dealer ? `<span data-go="#/dealer/dashboard">لوحتي (${dealer.name})</span>` : `<span data-go="#/dealer">دخول معرض</span>`}
      </div>
    </div>
  `);
  bar.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>location.hash=b.dataset.go));
  return bar;
}

/* ---------------- router ---------------- */
async function router(){
  app.innerHTML = "";
  app.appendChild(renderTopbar());
  const main = el(`<main></main>`);
  app.appendChild(main);

  if(!isConfigured()){
    main.appendChild(el(`
      <div class="panel" style="border-color:var(--rust)">
        <h2 style="color:var(--rust)">⚠️ الإعداد غير مكتمل</h2>
        <p class="muted">افتح ملف index.html وعدّل قيم SUPABASE_URL و SUPABASE_ANON_KEY في أعلى كود &lt;script&gt; ببيانات مشروعك في Supabase، ثم شغّل ملف schema.sql مرة واحدة من SQL Editor.</p>
      </div>
    `));
    return;
  }

  const hash = location.hash || "#/";
  if(hash.startsWith("#/showroom/")){
    const id = hash.split("#/showroom/")[1];
    return renderStorefront(main, id);
  }
  if(hash === "#/admin") return renderAdmin(main);
  if(hash === "#/dealer") return renderDealerLogin(main);
  if(hash === "#/dealer/dashboard") return renderDealerDashboard(main);
  return renderLanding(main);
}
window.addEventListener("hashchange", router);

/* ---------------- landing ---------------- */
function renderLanding(main){
  main.appendChild(el(`
    <div class="hero">
      <span class="tag">نسخة تجريبية (MVP)</span>
      <h1>منصة كتالوج المعارض الموحّد</h1>
      <p>كتالوج مركزي واحد للسيارات، وكل معرض يضيف سعره ولونه وعدده الخاص — بدون أن يرى معرضٌ معروضات معرض آخر.</p>
      <div class="role-grid">
        <div class="role-card">
          <span class="icon">🗂️</span>
          <h3>أنا المدير</h3>
          <p>إضافة السيارات والمواصفات والصور للكتالوج المركزي</p>
          <button class="btn btn-amber btn-block" data-go="#/admin">دخول لوحة المدير</button>
        </div>
        <div class="role-card">
          <span class="icon">🏬</span>
          <h3>أنا معرض</h3>
          <p>تسجيل الدخول لإضافة أسعاري وألواني وعرض سياراتي</p>
          <button class="btn btn-outline btn-block" data-go="#/dealer">دخول المعرض</button>
        </div>
      </div>
    </div>
  `));
  main.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>location.hash=b.dataset.go));
}

/* ---------------- ADMIN ---------------- */
async function renderAdmin(main){
  if(sessionStorage.getItem("is_admin") !== "1"){
    const box = el(`
      <div class="panel" style="max-width:380px;margin:40px auto;">
        <h2>🔒 دخول المدير</h2>
        <label>كلمة المرور</label>
        <input type="password" id="adminPass" placeholder="••••••">
        <button class="btn btn-amber btn-block" style="margin-top:16px" id="adminGo">دخول</button>
      </div>
    `);
    main.appendChild(box);
    box.querySelector("#adminGo").addEventListener("click", ()=>{
      if(box.querySelector("#adminPass").value === ADMIN_PASSWORD){
        sessionStorage.setItem("is_admin","1");
        router();
      } else toast("كلمة مرور غير صحيحة");
    });
    return;
  }

  main.appendChild(el(`
    <div class="panel">
      <h2>➕ إضافة سيارة جديدة للكتالوج</h2>
      <div class="row2">
        <div><label>الماركة</label><input type="text" id="c_brand" placeholder="تويوتا"></div>
        <div><label>الموديل</label><input type="text" id="c_model" placeholder="كامري"></div>
      </div>
      <div class="row2">
        <div><label>الفئة (Trim)</label><input type="text" id="c_trim" placeholder="GLE"></div>
        <div><label>سنة الصنع</label><input type="number" id="c_year" placeholder="2026"></div>
      </div>
      <label>المواصفات الكاملة</label>
      <textarea id="c_specs" placeholder="محرك 2.5L — فتحة سقف — شاشة 9 بوصة — كاميرا خلفية"></textarea>
      <label>الألوان المتاحة (افصل بينها بفاصلة ،)</label>
      <input type="text" id="c_colors" placeholder="أبيض، أسود، فضي">
      <label>روابط الصور (افصل بينها بفاصلة ، — رابط واحد على الأقل)</label>
      <input type="text" id="c_images" placeholder="https://...">
      <button class="btn btn-amber" style="margin-top:16px" id="addCarBtn">إضافة للكتالوج</button>
    </div>
    <div class="panel">
      <h2>🚗 الكتالوج المركزي (<span id="carCount">0</span>)</h2>
      <div id="adminCatalog" class="catalog-grid"><p class="muted">جاري التحميل…</p></div>
    </div>
  `));

  main.querySelector("#addCarBtn").addEventListener("click", async ()=>{
    const brand = main.querySelector("#c_brand").value.trim();
    const model = main.querySelector("#c_model").value.trim();
    const trim = main.querySelector("#c_trim").value.trim();
    const year = parseInt(main.querySelector("#c_year").value);
    const specs = main.querySelector("#c_specs").value.trim();
    const colors = main.querySelector("#c_colors").value.split("،").map(s=>s.trim()).filter(Boolean);
    const images = main.querySelector("#c_images").value.split("،").map(s=>s.trim()).filter(Boolean);
    if(!brand || !model || !year){ toast("عبّي الماركة والموديل والسنة على الأقل"); return; }
    const { error } = await sb.from("cars").insert({brand,model,trim,year,specs,colors,images});
    if(error){ toast("خطأ: "+error.message); return; }
    toast("تمت إضافة السيارة ✅");
    ["c_brand","c_model","c_trim","c_year","c_specs","c_colors","c_images"].forEach(id=>main.querySelector("#"+id).value="");
    loadAdminCatalog(main);
  });

  loadAdminCatalog(main);
}

async function loadAdminCatalog(main){
  const wrap = main.querySelector("#adminCatalog");
  const { data, error } = await sb.from("cars").select("*").order("created_at",{ascending:false});
  if(error){ wrap.innerHTML = `<p class="muted">تعذر التحميل: ${error.message}</p>`; return; }
  main.querySelector("#carCount").textContent = data.length;
  if(!data.length){ wrap.innerHTML = `<div class="empty">لا توجد سيارات بعد — أضف أول سيارة من الأعلى</div>`; return; }
  wrap.innerHTML = "";
  data.forEach(car=>{
    wrap.appendChild(el(`
      <div class="plate-card">
        <div class="rivets"><i></i><i></i></div>
        <img src="${(car.images&&car.images[0])||''}" onerror="this.style.display='none'">
        <div class="plate-body">
          <p class="plate-title">${car.brand} ${car.model} ${car.trim||""}</p>
          <p class="plate-sub">موديل ${car.year}</p>
          <p class="plate-specs">${car.specs||""}</p>
          <div class="swatches">${(car.colors||[]).map(c=>`<span class="swatch">${c}</span>`).join("")}</div>
          <button class="btn btn-rust btn-sm" data-del="${car.id}">حذف السيارة</button>
        </div>
      </div>
    `));
  });
  wrap.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      if(!confirm("حذف هذه السيارة من الكتالوج نهائياً؟ سيُحذف أيضاً من كل معروضات المعارض.")) return;
      const { error } = await sb.from("cars").delete().eq("id", b.dataset.del);
      if(error){ toast("خطأ: "+error.message); return; }
      toast("تم الحذف");
      loadAdminCatalog(main);
    });
  });
}

/* ---------------- DEALER LOGIN ---------------- */
function renderDealerLogin(main){
  main.appendChild(el(`
    <div class="panel" style="max-width:380px;margin:40px auto;">
      <h2>🏬 دخول المعرض</h2>
      <label>كود الدخول</label>
      <input type="text" id="d_code" placeholder="مثال: demo1">
      <label>كلمة المرور</label>
      <input type="password" id="d_pass" placeholder="••••••">
      <button class="btn btn-amber btn-block" style="margin-top:16px" id="d_go">دخول</button>
      <p class="muted" style="margin-top:12px">للتجربة: الكود demo1 وكلمة المرور 1234</p>
    </div>
  `));
  main.querySelector("#d_go").addEventListener("click", async ()=>{
    const code = main.querySelector("#d_code").value.trim();
    const pass = main.querySelector("#d_pass").value.trim();
    if(!code || !pass){ toast("عبّي الكود وكلمة المرور"); return; }
    const { data, error } = await sb.rpc("dealer_login", { p_code: code, p_password: pass });
    if(error){ toast("خطأ: "+error.message); return; }
    if(!data || !data.length){ toast("بيانات الدخول غير صحيحة"); return; }
    localStorage.setItem("dealer_session", JSON.stringify(data[0]));
    toast("مرحباً "+data[0].name);
    location.hash = "#/dealer/dashboard";
  });
}

/* ---------------- DEALER DASHBOARD ---------------- */
async function renderDealerDashboard(main){
  const dealer = currentDealer();
  if(!dealer){ location.hash = "#/dealer"; return; }

  const publicUrl = location.origin + location.pathname + "#/showroom/" + dealer.id;

  main.appendChild(el(`
    <div class="panel">
      <h2>مرحباً، ${dealer.name} 👋</h2>
      <p class="muted">هذا رابط صفحتك العامة — شاركه مع عملائك (واتساب/سناب):</p>
      <div class="link-box">${publicUrl}</div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px" id="copyLink">نسخ الرابط</button>
      <button class="btn btn-outline btn-sm" style="margin-top:10px" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="panel">
      <h2>➕ إضافة سيارة من الكتالوج لعروضي</h2>
      <div id="pickerCatalog" class="catalog-grid"><p class="muted">جاري التحميل…</p></div>
    </div>

    <div class="panel">
      <h2>📋 سياراتي المعروضة</h2>
      <div id="myListings"><p class="muted">جاري التحميل…</p></div>
    </div>
  `));

  main.querySelector("#copyLink").addEventListener("click", ()=>{
    navigator.clipboard.writeText(publicUrl);
    toast("تم نسخ الرابط");
  });
  main.querySelector("#logoutBtn").addEventListener("click", ()=>{
    localStorage.removeItem("dealer_session");
    location.hash = "#/";
  });

  loadPickerCatalog(main, dealer);
  loadMyListings(main, dealer);
}

async function loadPickerCatalog(main, dealer){
  const wrap = main.querySelector("#pickerCatalog");
  const { data, error } = await sb.from("cars").select("*").order("created_at",{ascending:false});
  if(error){ wrap.innerHTML = `<p class="muted">تعذر التحميل: ${error.message}</p>`; return; }
  if(!data.length){ wrap.innerHTML = `<div class="empty">لا توجد سيارات في الكتالوج بعد</div>`; return; }
  wrap.innerHTML = "";
  data.forEach(car=>{
    const card = el(`
      <div class="plate-card">
        <div class="rivets"><i></i><i></i></div>
        <img src="${(car.images&&car.images[0])||''}" onerror="this.style.display='none'">
        <div class="plate-body">
          <p class="plate-title">${car.brand} ${car.model} ${car.trim||""}</p>
          <p class="plate-sub">موديل ${car.year}</p>
          <label style="margin-top:8px">اللون</label>
          <select class="pick-color">${(car.colors||[]).map(c=>`<option value="${c}">${c}</option>`).join("") || `<option value="">—</option>`}</select>
          <label>السعر (ريال)</label>
          <input type="number" class="pick-price" placeholder="120000">
          <label>العدد المتوفر</label>
          <input type="number" class="pick-qty" placeholder="1" value="1">
          <button class="btn btn-amber btn-sm btn-block" style="margin-top:10px" data-add="${car.id}">أضف لعروضي</button>
        </div>
      </div>
    `);
    card.querySelector("[data-add]").addEventListener("click", async ()=>{
      const color = card.querySelector(".pick-color").value;
      const price = parseFloat(card.querySelector(".pick-price").value);
      const qty = parseInt(card.querySelector(".pick-qty").value) || 1;
      if(!color || !price){ toast("حدد اللون والسعر"); return; }
      const { error } = await sb.from("listings").upsert({
        dealer_id: dealer.id, car_id: car.id, color, price, quantity: qty, updated_at: new Date().toISOString()
      }, { onConflict: "dealer_id,car_id,color" });
      if(error){ toast("خطأ: "+error.message); return; }
      toast("تمت الإضافة لعروضك ✅");
      loadMyListings(main, dealer);
    });
    wrap.appendChild(card);
  });
}

async function loadMyListings(main, dealer){
  const wrap = main.querySelector("#myListings");
  const { data, error } = await sb
    .from("listings")
    .select("id, color, price, quantity, cars(brand,model,trim,year)")
    .eq("dealer_id", dealer.id)
    .order("created_at",{ascending:false});
  if(error){ wrap.innerHTML = `<p class="muted">تعذر التحميل: ${error.message}</p>`; return; }
  if(!data.length){ wrap.innerHTML = `<div class="empty">لم تضف أي سيارة بعد</div>`; return; }
  wrap.innerHTML = "";
  data.forEach(l=>{
    const row = el(`
      <div class="listing-row">
        <div class="info"><b>${l.cars.brand} ${l.cars.model} ${l.cars.trim||""} ${l.cars.year}</b> — اللون: ${l.color}</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="price-chip mono">${fmtPrice(l.price)} <small>ريال</small></span>
          <span class="qty-badge">العدد: ${l.quantity}</span>
          <button class="btn btn-rust btn-sm" data-del="${l.id}">حذف</button>
        </div>
      </div>
    `);
    row.querySelector("[data-del]").addEventListener("click", async ()=>{
      const { error } = await sb.from("listings").delete().eq("id", l.id);
      if(error){ toast("خطأ: "+error.message); return; }
      toast("تم الحذف");
      loadMyListings(main, dealer);
    });
    wrap.appendChild(row);
  });
}

/* ---------------- PUBLIC STOREFRONT ---------------- */
async function renderStorefront(main, dealerId){
  main.style.maxWidth = "1100px";
  const { data: dealer, error: dErr } = await sb.from("dealer_public").select("*").eq("id", dealerId).single();
  if(dErr || !dealer){
    main.appendChild(el(`<div class="empty">هذا المعرض غير موجود</div>`));
    return;
  }
  const header = el(`
    <div class="storefront-header">
      ${dealer.logo_url ? `<img src="${dealer.logo_url}">` : ""}
      <h1>${dealer.name}</h1>
      <p>معرض سيارات — تصفح أحدث العروض</p>
      ${dealer.phone ? `<a class="whatsapp-btn" target="_blank" href="https://wa.me/${dealer.phone}">💬 تواصل واتساب</a>` : ""}
    </div>
  `);
  main.before(header);
  main.style.marginTop = "20px";

  const grid = el(`<div class="catalog-grid" id="storeGrid"><p class="muted">جاري التحميل…</p></div>`);
  main.appendChild(grid);

  const { data, error } = await sb
    .from("listings")
    .select("id, color, price, quantity, cars(brand,model,trim,year,specs,images)")
    .eq("dealer_id", dealerId)
    .gt("quantity", 0)
    .order("created_at",{ascending:false});

  if(error){ grid.innerHTML = `<p class="muted">تعذر التحميل: ${error.message}</p>`; return; }
  if(!data.length){ grid.innerHTML = `<div class="empty">لا توجد سيارات معروضة حالياً</div>`; return; }
  grid.innerHTML = "";
  data.forEach(l=>{
    grid.appendChild(el(`
      <div class="plate-card">
        <div class="rivets"><i></i><i></i></div>
        <img src="${(l.cars.images&&l.cars.images[0])||''}" onerror="this.style.display='none'">
        <div class="plate-body">
          <p class="plate-title">${l.cars.brand} ${l.cars.model} ${l.cars.trim||""}</p>
          <p class="plate-sub">موديل ${l.cars.year} — اللون: ${l.color}</p>
          <p class="plate-specs">${l.cars.specs||""}</p>
          <span class="price-chip mono">${fmtPrice(l.price)} <small>ريال</small></span>
          <span class="qty-badge">متوفر: ${l.quantity}</span>
        </div>
      </div>
    `));
  });
}

router();
</script>
